{% extends 'base.html' %}
{% load static %}

{% block title %}Login - Blood and Guts{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card bg-dark border-danger">
                <div class="card-header bg-black text-danger">
                    <h3 class="mb-0">Login</h3>
                </div>
                <div class="card-body">
                    <form method="POST" class="needs-validation" novalidate>
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_username" class="form-label">Username</label>
                            <input type="text" name="username" class="form-control bg-dark text-light" id="id_username" required>
                            <div class="invalid-feedback">
                                Please enter your username.
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="id_password" class="form-label">Password</label>
                            <input type="password" name="password" class="form-control bg-dark text-light" id="id_password" required>
                            <div class="invalid-feedback">
                                Please enter your password.
                            </div>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-danger">Login</button>
                        </div>
                    </form>
                </div>
                <div class="card-footer bg-dark">
                    <div class="text-center">
                        <p>Don't have an account? <a href="{% url 'users:register' %}" class="text-danger">Register here</a></p>
                        <p><a href="{% url 'users:password_reset' %}" class="text-danger">Forgot your password?</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
