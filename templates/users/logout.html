{% extends 'base.html' %}
{% load static %}

{% block title %}Logged Out - Blood and Guts{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card bg-dark border-danger">
                <div class="card-header bg-black text-danger">
                    <h3 class="mb-0">Logged Out</h3>
                </div>
                <div class="card-body text-center">
                    <i class="fas fa-check-circle text-success fa-5x mb-3"></i>
                    <h4>You have been successfully logged out.</h4>
                    <p class="mb-4">Thank you for visiting Blood & Guts!</p>
                    <div class="d-grid gap-2">
                        <a href="{% url 'users:login' %}" class="btn btn-danger">Log In Again</a>
                        <a href="{% url 'core:home' %}" class="btn btn-outline-light">Return to Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
