{% extends 'base.html' %}
{% load static %}

{% block title %}Server Error - Blood and Guts{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <i class="fas fa-exclamation-circle text-danger fa-5x mb-4"></i>
            <h1 class="display-4 text-danger mb-4">500 - Server Error</h1>
            <p class="lead mb-5">Something went wrong on our end. We're working to fix the issue. Please try again later.</p>
            <div class="d-flex justify-content-center gap-3">
                <a href="{% url 'core:home' %}" class="btn btn-danger btn-lg">Return to Home</a>
                <a href="{% url 'core:contact' %}" class="btn btn-outline-light btn-lg">Contact Support</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
