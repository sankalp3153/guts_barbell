services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      DB_ENGINE: postgres
      DB_HOST: postgres
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: guts_barbell
      POSTGRES_USER: guts
      POSTGRES_PASSWORD: guts_secret
